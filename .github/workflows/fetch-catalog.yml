name: Fetch catalog (DofusDB)

# Manually-triggered: fetch the HDV catalog from DofusDB on a runner (which has
# the internet access the app's sandbox lacks) and commit the bundled snapshot.
on:
  workflow_dispatch:
    inputs:
      super_types:
        description: "Super-type ids, space-separated (9 = Ressources)"
        required: false
        default: "9"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch catalog
        run: node scripts/fetch-catalog.mjs ${{ inputs.super_types }}
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-src src/data/catalog.generated.ts
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Fetch HDV catalog from DofusDB"
            git push
          fi
